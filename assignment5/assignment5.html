<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>1.personal Information</legend>
        <label>Full Name</label>
        <input type="text" placeholder="Enter your Full Name">

        <br><br>

        <label>create Password</label>
        <input type="password">
        <br><br>

        <label>Email Address :</label>
        <input type="eamil" placeholder="example@email.com">
        <br><br>

        <label>Mobile Number</label>
        <input type="tel" placeholder="10 digit mobile number">
        <br><br>

        <label>Age</label>
        <input type="number">
        <br><br>

        <label>Date of Birth :</label>
        <input type="date">
        <br><br>

        <label>Gender</label>
        <input type="radio">Male
        <input type="radio">Female
        <input type="radio">Other
        <br><br>

        <label>Current Address</label>
        <input type="text" placeholder="Enter your address">
        <br><br>

        <label>Profile Photograph :</label>
        <input type="file">
        <br><br>

        <label>Portfolio Website:</label>
        <input type="url" placeholder="https:/example.com">
        <br><br>

    </fieldset>
    <br><br>

    <fieldset>
        <label>2.Educational Back</label>
        <br><br>

        <label>Highest Qualification :</label>
        <select>
            <option>HSC</option>
            <option>SSC</option>
            <option>Engineering</option>
            <option>Diploma</option>
        </select>
        <br><br>

        <label>College Name :</label>
        <input type="text" placeholder="Enter collage name">
        <br><br>

        <label>Granduation Month :</label>
        <input type="month">
        <br><br>

        <label>Preferred Internship Week :</label>
        <input type="week">
        <br><br>

        <label>Graduation Year :</label>
        <input type="number">
        <br><br>

        <label>Certification Completed:</label>
        <input type="checkbox"> Java
        <input type="checkbox">Python
        <input type="checkbox">Web Devlopment
        <br><br>

        <label>Preffered Interview Date:</label>
        <input type="datetime-local">
        <br><br>

    </fieldset>
    <br><br>

    <fieldset>
        <label>3.Job preferences</label>
        <br><br>
        <label>Search Job Role:</label>
        <input type="text" placeholder="Search job position">
        <br><br>

        <label>Select Job Role:</label>
        <select>
            <option>--select job role---</option>
            <option>Frontend Developer</option>
            <option>Backend Developer</option>
        </select>
        <br><br>

        <label>Employment Type:</label>
        <input type="radio">Full Time
        <input type="radio">Part Time
        <input type="radio">Internship 
        <br><br>

        <label>Expected Monthly Salary(INR):</label>
        <input type="number">
        <br><Br>
        
        <label>Preferred Interview Time:</label>
        <input type="time">
        <br><br>
        
        <label>Preferred Them Color:</label>
        <input type="color">
        <br><Br>

        <label>Coding Confidence(0-100):</label>
        <input type="range">
        <br><br>
        
        <label>Linkedin Profile:</label>
        <input type="url" placeholder="https://linkedin.com/in/user">
        <br><br>
    </fieldset>

    <br>
    <fieldset>
        <label>4.Technical Skills and Experience</label>
        <br><br>

        <label>Year of Experience:</label>
        <input type="number">
        <br>

        <label>Preferred Technology:</label>
        <imput type="text">
        <br><br>

        <label>Technical Skills:</label>
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>Javascript</option>
            <option>Python</option>
        </select>
        <br>

        <label>use Ctrl(Windows)or Command(Mac) to select multiple skills.</label>
        <br>

        <label>Upload Resume(PDF only):</label>
        <input type="file">
        <br>

        <label>Upload Certification:</label>
        <input type="file">
        <br>

        <label>Why should we hire you?</label>
        <input type="text" placeholder="Decribe your skills and strengths">
        <br>
       
    </fieldset>

    <fieldset>
        <label>5.Skill Assignment a=ANd Application Status</label>
        <br><br>

        <label>HTML Skill Level:</label>
        <input type="range">
        <br><br>

        <label>Application Completion:</label>
        <input type="range">
        <br><br>

        <label>Application Status:Ready for submission</label>
        <br>
        <input type="checkbox">I confirm that the information provided is correct.
        <br>


    </fieldset>
    <br>
    <input type="button" value="submit Application">
    <input type="reset" value="Reset Form">
    <input type="button" value="HElp">
    <input type="button" value="Preview Application">
    <br>
    <hr>

    <h1>Additional Examples</h1>
    <br>

    <fieldset>
        <label>Search Avaliable Jobs</label>
        <br>
        <label>Job Title:</label>
        <input type="text">
        <input type="button" value="Search Jobs">
    </fieldset>
    <br>
    <fieldset>
        <label>Ready-only and Disabled Firld</label>
    </fieldset>
</body>
</html>
